name: Deploy Master Intech Backend

on:
  push:
    branches:
      - master
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MASTERINTECH_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.MASTERINTECH_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.MASTERINTECH_SSH_PORT }}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -p "${{ secrets.MASTERINTECH_SSH_PORT }}" \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            ${{ secrets.MASTERINTECH_SSH_USER }}@${{ secrets.MASTERINTECH_SSH_HOST }} \
            "echo SSH connection successful"

      - name: Deploy backend files
        run: |
          tar \
            --exclude='node_modules' \
            --exclude='.env' \
            -czf backend.tar.gz \
            -C server .

          scp \
            -P "${{ secrets.MASTERINTECH_SSH_PORT }}" \
            -i ~/.ssh/id_ed25519 \
            backend.tar.gz \
            ${{ secrets.MASTERINTECH_SSH_USER }}@${{ secrets.MASTERINTECH_SSH_HOST }}:/home/sloaofao/masterintech-api/

          ssh \
            -p "${{ secrets.MASTERINTECH_SSH_PORT }}" \
            -i ~/.ssh/id_ed25519 \
            ${{ secrets.MASTERINTECH_SSH_USER }}@${{ secrets.MASTERINTECH_SSH_HOST }} \
            "cd /home/sloaofao/masterintech-api && tar -xzf backend.tar.gz && rm backend.tar.gz"

      - name: Install production dependencies
        run: |
          ssh \
            -p "${{ secrets.MASTERINTECH_SSH_PORT }}" \
            -i ~/.ssh/id_ed25519 \
            ${{ secrets.MASTERINTECH_SSH_USER }}@${{ secrets.MASTERINTECH_SSH_HOST }} \
            "source /home/sloaofao/nodevenv/masterintech-api/20/bin/activate && cd /home/sloaofao/masterintech-api && npm ci --omit=dev"

      - name: Restart Node.js application
        run: |
          ssh \
            -p "${{ secrets.MASTERINTECH_SSH_PORT }}" \
            -i ~/.ssh/id_ed25519 \
            ${{ secrets.MASTERINTECH_SSH_USER }}@${{ secrets.MASTERINTECH_SSH_HOST }} \
            "touch /home/sloaofao/masterintech-api/tmp/restart.txt"